name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pfrack/review-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          custom_models: ${{ secrets.CUSTOM_MODELS }}
          custom_models_base_url: ${{ secrets.CUSTOM_MODELS_BASE_URL }}
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          kilocode_api_key: ${{ secrets.KILO_API_KEY }}
          custom_api_url: ${{ secrets.CUSTOM_API_URL }}
          custom_model: ${{ secrets.CUSTOM_MODEL }}
          custom_api_key: ${{ secrets.CUSTOM_API_KEY }}
          nim_api_key: ${{ secrets.NIM_API_KEY }}
          mistral_api_key: ${{ secrets.MISTRAL_API_KEY }}
          groq_api_key: ${{ secrets.GROQ_API_KEY }}
          custom_swe_score: ${{ secrets.CUSTOM_SWE_SCORE }}
