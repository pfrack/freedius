{{define "provider-drawer"}}
<div class="drawer__content">
  <div class="drawer__header">
    <h2 class="drawer__title">{{.Name}}</h2>
    <button class="drawer__close" onclick="closeDrawer()" aria-label="Close drawer">✕</button>
  </div>

  <div class="drawer__body">
    <div class="drawer__field">
      <span class="drawer__label">Status</span>
      <span class="badge badge--status-{{.StatusSlug}}">{{.StatusLabel}}</span>
    </div>

    <div class="drawer__field">
      <span class="drawer__label">Protocol</span>
      <span>{{.Protocol}}</span>
    </div>

    <div class="drawer__field">
      <span class="drawer__label">Base URL</span>
      <span class="model-id" title="{{.BaseURL}}">{{.BaseURL}}</span>
    </div>

    <div class="drawer__field">
      <span class="drawer__label">API Key Env</span>
      <span>{{if not .EnvDeclared}}Not required{{else if .EnvPresent}}Declared · Set{{else}}Declared · Missing{{end}}</span>
    </div>

    <div class="drawer__actions">
      <a href="{{.EditLink}}" class="btn btn--primary">Edit on Providers page</a>
    </div>
  </div>
</div>
{{end}}
