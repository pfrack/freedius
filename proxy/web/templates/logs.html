{{define "logs"}}{{template "layout" .}}{{end}}
{{define "title"}}Logs{{end}}
{{define "content"}}
  <h1>Logs</h1>
  <div class="log-filters">
    <div class="form-group">
      <label class="form-label" for="level-filter">Level</label>
      <select
        id="level-filter"
        class="form-select"
        name="min"
        hx-get="/logs"
        hx-target="#log"
        hx-trigger="change"
        hx-include=".log-filters [name]"
        hx-replace-url="true"
      >
        <option value="" {{if not .Level}}selected{{end}}>All</option>
        <option value="debug" {{if eq .Level "debug"}}selected{{end}}>Debug</option>
        <option value="info" {{if eq .Level "info"}}selected{{end}}>Info</option>
        <option value="warn" {{if eq .Level "warn"}}selected{{end}}>Warn</option>
        <option value="error" {{if eq .Level "error"}}selected{{end}}>Error</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label" for="provider-filter">Provider</label>
      <input
        id="provider-filter"
        class="form-input"
        name="provider"
        placeholder="Filter provider…"
        value="{{.Provider}}"
        hx-get="/logs"
        hx-target="#log"
        hx-trigger="keyup changed delay:300ms"
        hx-include=".log-filters [name]"
        hx-replace-url="true"
      >
    </div>
    <div class="form-group">
      <label class="form-label" for="mapping-filter">Mapping</label>
      <input
        id="mapping-filter"
        class="form-input"
        name="mapping"
        placeholder="Filter mapping…"
        value="{{.Mapping}}"
        hx-get="/logs"
        hx-target="#log"
        hx-trigger="keyup changed delay:300ms"
        hx-include=".log-filters [name]"
        hx-replace-url="true"
      >
    </div>
    <div class="form-group">
      <label class="form-label" for="outcome-filter">Outcome</label>
      <select
        id="outcome-filter"
        class="form-select"
        name="outcome"
        hx-get="/logs"
        hx-target="#log"
        hx-trigger="change"
        hx-include=".log-filters [name]"
        hx-replace-url="true"
      >
        <option value="" {{if not .Outcome}}selected{{end}}>All</option>
        <option value="success" {{if eq .Outcome "success"}}selected{{end}}>Success</option>
        <option value="error" {{if eq .Outcome "error"}}selected{{end}}>Error</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label" for="fallback-filter">Fallback</label>
      <select
        id="fallback-filter"
        class="form-select"
        name="fallback"
        hx-get="/logs"
        hx-target="#log"
        hx-trigger="change"
        hx-include=".log-filters [name]"
        hx-replace-url="true"
      >
        <option value="" {{if not .Fallback}}selected{{end}}>All</option>
        <option value="true" {{if eq .Fallback "true"}}selected{{end}}>Yes</option>
        <option value="false" {{if eq .Fallback "false"}}selected{{end}}>No</option>
      </select>
    </div>
  </div>
  <div
    id="log"
    class="log-container"
    hx-ext="sse"
    sse-connect="/v1/logs"
  >
    {{if not .Entries}}
    <small class="text-muted">Waiting for log events…</small>
    {{end}}
    {{range .Entries}}<pre class="log-{{.Level}}">{{.Line}}</pre>{{end}}
  </div>
{{end}}
{{define "scripts"}}
<script>
  // System-log detection heuristic: lines containing startup/listening/config
  // keywords get the .log-system class for visual distinction from routing logs.
  function isSystemLog(line) {
    var lower = line.toLowerCase();
    return lower.indexOf('listening') !== -1 ||
           lower.indexOf('loaded config') !== -1 ||
           lower.indexOf('starting') !== -1 ||
           lower.indexOf('config loaded') !== -1;
  }

  // Cap DOM growth for long-running sessions. The server-side ring buffer
  // (10k entries) is unaffected — this only bounds what the browser holds.
  var MAX_LOG_LINES = 500;

  // Order matters: append -> scroll -> trim. Scrolling before the trim keeps
  // the view pinned to the newest line during bursts.
  function appendLogLine(pre) {
    var logEl = document.getElementById('log');
    logEl.appendChild(pre);
    logEl.scrollTop = logEl.scrollHeight;
    while (logEl.children.length > MAX_LOG_LINES) {
      logEl.removeChild(logEl.firstElementChild);
    }
  }

  document.addEventListener('htmx:sseMessage', function(e) {
    if (e.detail.eventName !== 'log') return;
    var pre = document.createElement('pre');
    try {
      var data = JSON.parse(e.detail.data);
      pre.className = 'log-' + data.level;
      if (isSystemLog(data.line)) {
        pre.className += ' log-system';
      }
      pre.textContent = data.line;
      appendLogLine(pre);
    } catch (err) {
      // Fallback: render raw data as info
      pre.className = 'log-info';
      pre.textContent = e.detail.data;
      appendLogLine(pre);
    }
  });
</script>
{{end}}
