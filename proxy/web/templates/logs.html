{{template "layout" .}}
{{define "title"}}Logs{{end}}
{{define "content"}}
  <h1>Logs</h1>
  <div class="log-filters">
    <div class="form-group">
      <label class="form-label" for="level-filter">Level</label>
      <select
        id="level-filter"
        class="form-select"
        name="min"
        hx-get="/logs"
        hx-target="#log"
        hx-trigger="change"
        hx-include=".log-filters [name]"
        hx-replace-url="true"
      >
        <option value="" {{if not .Level}}selected{{end}}>All</option>
        <option value="debug" {{if eq .Level "debug"}}selected{{end}}>Debug</option>
        <option value="info" {{if eq .Level "info"}}selected{{end}}>Info</option>
        <option value="warn" {{if eq .Level "warn"}}selected{{end}}>Warn</option>
        <option value="error" {{if eq .Level "error"}}selected{{end}}>Error</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label" for="provider-filter">Provider</label>
      <input
        id="provider-filter"
        class="form-input"
        name="provider"
        placeholder="Filter provider…"
        value="{{.Provider}}"
        hx-get="/logs"
        hx-target="#log"
        hx-trigger="keyup changed delay:300ms"
        hx-include=".log-filters [name]"
        hx-replace-url="true"
      >
    </div>
    <div class="form-group">
      <label class="form-label" for="mapping-filter">Mapping</label>
      <input
        id="mapping-filter"
        class="form-input"
        name="mapping"
        placeholder="Filter mapping…"
        value="{{.Mapping}}"
        hx-get="/logs"
        hx-target="#log"
        hx-trigger="keyup changed delay:300ms"
        hx-include=".log-filters [name]"
        hx-replace-url="true"
      >
    </div>
    <div class="form-group">
      <label class="form-label" for="outcome-filter">Outcome</label>
      <select
        id="outcome-filter"
        class="form-select"
        name="outcome"
        hx-get="/logs"
        hx-target="#log"
        hx-trigger="change"
        hx-include=".log-filters [name]"
        hx-replace-url="true"
      >
        <option value="" {{if not .Outcome}}selected{{end}}>All</option>
        <option value="success" {{if eq .Outcome "success"}}selected{{end}}>Success</option>
        <option value="error" {{if eq .Outcome "error"}}selected{{end}}>Error</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label" for="fallback-filter">Fallback</label>
      <select
        id="fallback-filter"
        class="form-select"
        name="fallback"
        hx-get="/logs"
        hx-target="#log"
        hx-trigger="change"
        hx-include=".log-filters [name]"
        hx-replace-url="true"
      >
        <option value="" {{if not .Fallback}}selected{{end}}>All</option>
        <option value="true" {{if eq .Fallback "true"}}selected{{end}}>Yes</option>
        <option value="false" {{if eq .Fallback "false"}}selected{{end}}>No</option>
      </select>
    </div>
    <span class="log-live-dot" data-state="connecting" title="Live tail connection"></span>
  </div>
  <div
    id="log"
    class="log-container"
    hx-ext="sse"
    sse-connect="/v1/logs"
    sse-swap="log"
    hx-swap="none"
  >
    <small class="text-muted" id="log-empty">Waiting for log events…</small>
  </div>
{{end}}
{{define "scripts"}}
<script>
  // System-log detection heuristic: lines containing startup/listening/config
  // keywords get the .log-system class for visual distinction from routing logs.
  function isSystemLog(line) {
    var lower = line.toLowerCase();
    return lower.indexOf('listening') !== -1 ||
           lower.indexOf('loaded config') !== -1 ||
           lower.indexOf('starting') !== -1 ||
           lower.indexOf('config loaded') !== -1;
  }

  // Cap DOM growth for long-running sessions. The server-side ring buffer
  // (10k entries) is unaffected — this only bounds what the browser holds.
  var MAX_LOG_LINES = 500;

  // Order matters: append -> scroll -> trim. Scrolling before the trim keeps
  // the view pinned to the newest line during bursts.
  var tailPaused = false;
  var SCROLL_PAUSE_THRESHOLD = 40; // px from bottom before we stop following

  function isNearBottom(logEl) {
    return logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - SCROLL_PAUSE_THRESHOLD;
  }

  function appendLogLine(pre) {
    var logEl = document.getElementById('log');
    logEl.appendChild(pre);
    if (!tailPaused) {
      logEl.scrollTop = logEl.scrollHeight;
    }
    while (logEl.children.length > MAX_LOG_LINES) {
      logEl.removeChild(logEl.firstElementChild);
    }
  }

  // Pause auto-follow when the operator scrolls up to read; resume once they
  // return to the bottom.
  document.getElementById('log').addEventListener('scroll', function(e) {
    var logEl = e.target;
    tailPaused = !isNearBottom(logEl);
  });

  // Connection-state dot: reflect the live SSE tail's status.
  function setLiveState(state) {
    var dot = document.querySelector('.log-live-dot');
    if (dot) dot.setAttribute('data-state', state);
  }
  document.addEventListener('htmx:sseOpen', function() { setLiveState('live'); });
  document.addEventListener('htmx:sseClose', function() { setLiveState('down'); });
  document.addEventListener('htmx:sseError', function() { setLiveState('down'); });

  // sse-swap="log" is what makes the extension register a listener for the
  // "log" event at all (sse-connect alone registers none). We do our own
  // rendering below, so hx-swap="none" keeps the extension from also
  // injecting the raw JSON payload into #log.
  document.addEventListener('htmx:sseMessage', function(e) {
    // The extension forwards the raw MessageEvent as detail, so the SSE event
    // name is detail.type ("log"); older builds exposed detail.eventName.
    if (!e.detail || typeof e.detail.data !== 'string') return;
    var sseEventName = e.detail.type || e.detail.eventName;
    if (sseEventName !== 'log') return;
    var ph = document.getElementById('log-empty');
    if (ph) ph.remove();
    var pre = document.createElement('pre');
    try {
      var data = JSON.parse(e.detail.data);
      pre.className = 'log-' + data.level;
      if (isSystemLog(data.line)) {
        pre.className += ' log-system';
      }
      pre.textContent = data.line;
      appendLogLine(pre);
    } catch (err) {
      // Fallback: render raw data as info
      pre.className = 'log-info';
      pre.textContent = e.detail.data;
      appendLogLine(pre);
    }
  });
</script>
{{end}}
