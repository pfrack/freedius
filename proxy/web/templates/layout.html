{{define "layout"}}<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="freedius — LLM proxy dashboard for managing providers, mappings, and fallback chains">
    <title>{{block "title" .}}{{end}} — freedius</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬡</text></svg>">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1/dist/fonts/geist-sans/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1/dist/fonts/geist-mono/style.css">
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to content</a>
    <button class="hamburger" onclick="document.querySelector('.sidebar').classList.toggle('sidebar--open');document.querySelector('.sidebar-overlay').classList.toggle('sidebar-overlay--visible')" aria-label="Toggle navigation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><polygon points="12 2 21 7 21 17 12 22 3 17 3 7 12 2"/></svg>
    </button>
    <div class="sidebar-overlay" onclick="document.querySelector('.sidebar').classList.remove('sidebar--open');this.classList.remove('sidebar-overlay--visible')"></div>

    <aside class="sidebar">
      <div class="sidebar-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        freedius
      </div>
      <nav>
        <a href="/" class="{{if eq .Active "index"}}active{{end}}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M12 12 18.4 5.6"/></svg>
          Dashboard
        </a>
        <a href="/mappings" class="{{if eq .Active "mappings"}}active{{end}}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="2.2"/><circle cx="19" cy="6" r="2.2"/><circle cx="19" cy="18" r="2.2"/><path d="M7.1 11.1 16.9 6.9"/><path d="M7.1 12.9 16.9 17.1"/></svg>
          Mappings
        </a>
        <a href="/providers" class="{{if eq .Active "providers"}}active{{end}}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M5.25 20v-5"/><path d="M9.75 20v-11"/><path d="M14.25 20v-7"/><path d="M18.75 20v-14"/></svg>
          Providers
        </a>
        <a href="/logs" class="{{if eq .Active "logs"}}active{{end}}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 3H6a1.8 1.8 0 0 0-1.8 1.8v14.4A1.8 1.8 0 0 0 6 21h7"/><path d="M8 8.5h4.5"/><path d="M8 12.5h3"/><circle cx="18" cy="17" r="3"/></svg>
          Logs
        </a>
      </nav>
    </aside>

    <main id="main-content">
      {{block "content" .}}{{end}}
    </main>
    <footer class="footer">
      <div class="footer__content">
        <span class="footer__copyright">freedius</span>
        <nav class="footer__nav" aria-label="Legal">
          <a href="https://github.com/pfrack/freedius/blob/main/LICENSE">License</a>
        </nav>
      </div>
    </footer>
    <div id="toast-region" aria-live="polite" role="status"></div>
    {{block "scripts" .}}{{end}}
    <script src="/static/htmx.min.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>{{end}}
