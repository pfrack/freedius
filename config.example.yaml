# freedius config — 100% free tier, no credit card required
# View and edit at http://localhost:8083/providers
#
# Free providers (sign up and export one or more keys):
#   export NVIDIA_NIM_API_KEY=nvapi-...   # build.nvidia.com
#   export GROQ_API_KEY=gsk_...           # console.groq.com
#   export GEMINI_API_KEY=AI...           # aistudio.google.com
#   export MISTRAL_API_KEY=...            # console.mistral.ai
#
# Supported providers are defined in providers.yaml

providers:
  nim:     { behavior: openai, default_api_key_env: NVIDIA_NIM_API_KEY }
  groq:    { behavior: openai, default_api_key_env: GROQ_API_KEY }
  google:  { behavior: openai, default_api_key_env: GEMINI_API_KEY }
  mistral: { behavior: openai, default_api_key_env: MISTRAL_API_KEY }

mappings:
  opus:
    provider_name: nim
    model_string: nvidia/nemotron-3-ultra-550b-a55b
    fallback:
      - provider_name: nim
        model_string: deepseek-ai/deepseek-v4-pro
      - provider_name: google
        model_string: gemini-2.5-pro
      - provider_name: groq
        model_string: openai/gpt-oss-120b

  sonnet:
    provider_name: nim
    model_string: deepseek-ai/deepseek-v4-pro
    fallback:
      - provider_name: groq
        model_string: openai/gpt-oss-120b
      - provider_name: google
        model_string: gemini-2.5-flash
      - provider_name: mistral
        model_string: mistral-large-latest

  haiku:
    provider_name: groq
    model_string: llama-3.3-70b-versatile
    fallback:
      - provider_name: nim
        model_string: deepseek-ai/deepseek-v4-flash
      - provider_name: google
        model_string: gemini-2.5-flash
      - provider_name: mistral
        model_string: mistral-small-latest

  default:
    provider_name: nim
    model_string: deepseek-ai/deepseek-v4-flash
    fallback:
      - provider_name: groq
        model_string: llama-3.3-70b-versatile
      - provider_name: google
        model_string: gemini-2.5-flash

  auto:
    provider_name: groq
    model_string: llama-3.3-70b-versatile
    fallback:
      - provider_name: nim
        model_string: deepseek-ai/deepseek-v4-flash
      - provider_name: google
        model_string: gemini-2.5-flash
