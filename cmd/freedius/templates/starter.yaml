# freedius starter config — works out of the box with free API tiers
#
# All providers below offer genuinely free access (no credit card required):
#   • NVIDIA NIM  — 1000 credits on signup, 40 RPM   (build.nvidia.com)
#   • Groq        — unlimited free tier, 30 RPM      (console.groq.com)
#   • Google      — free tier, ~15 RPM               (aistudio.google.com)
#   • Mistral     — ~1B tokens/month free            (console.mistral.ai)
#
# Set one or more API keys and freedius will route through the available
# providers automatically. Fallback chains ensure requests succeed even if
# one provider is overloaded or your key isn't set.
#
# Quick start:
#   export NVIDIA_NIM_API_KEY=nvapi-...   # build.nvidia.com → Generate API Key
#   export GROQ_API_KEY=gsk_...           # console.groq.com → API Keys
#   export GEMINI_API_KEY=AI...           # aistudio.google.com → Get API Key
#   export MISTRAL_API_KEY=...            # console.mistral.ai → API Keys
#
# You only need ONE key to get started — fallbacks skip providers without keys.

providers:
  nim:     { behavior: openai, default_api_key_env: NVIDIA_NIM_API_KEY }
  groq:    { behavior: openai, default_api_key_env: GROQ_API_KEY }
  google:  { behavior: openai, default_api_key_env: GEMINI_API_KEY }
  mistral: { behavior: openai, default_api_key_env: MISTRAL_API_KEY }

mappings:
  # ─── Flagship reasoning ("opus" tier) ───────────────────────────────
  opus:
    provider_name: nim
    model_string: nvidia/nemotron-3-ultra-550b-a55b
    fallback:
      - provider_name: nim
        model_string: deepseek-ai/deepseek-v4-pro
      - provider_name: google
        model_string: gemini-2.5-pro
      - provider_name: groq
        model_string: openai/gpt-oss-120b

  # ─── Strong mid-tier ("sonnet" tier) ────────────────────────────────
  sonnet:
    provider_name: nim
    model_string: deepseek-ai/deepseek-v4-pro
    fallback:
      - provider_name: groq
        model_string: openai/gpt-oss-120b
      - provider_name: google
        model_string: gemini-2.5-flash
      - provider_name: mistral
        model_string: mistral-large-latest

  # ─── Fast & cheap ("haiku" tier) ────────────────────────────────────
  haiku:
    provider_name: groq
    model_string: llama-3.3-70b-versatile
    fallback:
      - provider_name: nim
        model_string: deepseek-ai/deepseek-v4-flash
      - provider_name: google
        model_string: gemini-2.5-flash
      - provider_name: mistral
        model_string: mistral-small-latest

  # ─── Default / auto routing ─────────────────────────────────────────
  default:
    provider_name: nim
    model_string: deepseek-ai/deepseek-v4-flash
    fallback:
      - provider_name: groq
        model_string: llama-3.3-70b-versatile
      - provider_name: google
        model_string: gemini-2.5-flash

  auto:
    provider_name: groq
    model_string: llama-3.3-70b-versatile
    fallback:
      - provider_name: nim
        model_string: deepseek-ai/deepseek-v4-flash
      - provider_name: google
        model_string: gemini-2.5-flash
