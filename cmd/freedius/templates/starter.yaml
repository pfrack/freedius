# freedius starter config — works out of the box with one free NVIDIA NIM key
#
# The default starter uses NIM exclusively. Set one env var and start:
#   export NVIDIA_NIM_API_KEY=nvapi-...   # build.nvidia.com → Generate API Key
#   freedius
#
# NIM's free tier gives you 1000 credits on signup and 40 RPM, which is
# plenty for solo-dev traffic. Sign up at https://build.nvidia.com if
# you don't have a key yet.
#
# Want cross-provider fallback? Set more env vars (GROQ_API_KEY,
# GEMINI_API_KEY, MISTRAL_API_KEY) and add the corresponding providers to
# the `providers:` block below. The starter stays NIM-only so the
# three-step Quickstart works with one key; multi-provider setups are an
# opt-in extension.
#
# Note: the startup check (`checkRequiredEnvVars` in cmd/freedius/main.go)
# requires every provider referenced by a mapping to have its key set.
# Because this starter only references NIM, only NVIDIA_NIM_API_KEY is
# required.

providers:
  nim: { behavior: openai, default_api_key_env: NVIDIA_NIM_API_KEY }

mappings:
  # ─── Flagship reasoning ("opus" tier) ───────────────────────────────
  opus:
    provider_name: nim
    model_string: nvidia/nemotron-3-ultra-550b-a55b
    fallback:
      - provider_name: nim
        model_string: deepseek-ai/deepseek-v4-pro

  # ─── Strong mid-tier ("sonnet" tier) ────────────────────────────────
  sonnet:
    provider_name: nim
    model_string: deepseek-ai/deepseek-v4-pro

  # ─── Fast & cheap ("haiku" tier) ────────────────────────────────────
  haiku:
    provider_name: nim
    model_string: deepseek-ai/deepseek-v4-flash

  # ─── Default / auto routing ─────────────────────────────────────────
  default:
    provider_name: nim
    model_string: deepseek-ai/deepseek-v4-flash

  auto:
    provider_name: nim
    model_string: deepseek-ai/deepseek-v4-flash
