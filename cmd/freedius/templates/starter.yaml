# freedius starter config — NousResearch (LongCat 2.5 preview) primary, Poolside Laguna fallback
#
# Set these env vars and start:
#   export POOLSIDE_API_KEY=sky-...         # poolside.ai → API Keys
#   export NOUSRESEARCH_API_KEY=sk-nous-... # portal.nousresearch.com
#   freedius
#
# Note: missing API keys log a startup warning instead of failing startup.

providers:
  poolside: { behavior: openai, default_api_key_env: POOLSIDE_API_KEY }
  nous: { behavior: openai, default_api_key_env: NOUSRESEARCH_API_KEY }
  openrouter: { behavior: openai, default_api_key_env: OPENROUTER_API_KEY }
  kilo: { behavior: openai, default_api_key_env: KILO_API_KEY }

mappings:
  # ─── Flagship reasoning ("opus" tier) ───────────────────────────────
  opus:
    provider_name: nous
    model_string: meituan/longcat-2.5-preview:free
    fallback:
      - provider_name: nous
        model_string: poolside/laguna-s-2.1:free
      - provider_name: poolside
        model_string: poolside/laguna-s-2.1
      - provider_name: openrouter
        model_string: thinkingmachines/inkling:free
      - provider_name: kilo
        model_string: kilo-auto/free

  # ─── Strong mid-tier ("sonnet" tier) ────────────────────────────────
  sonnet:
    provider_name: nous
    model_string: meituan/longcat-2.5-preview:free
    fallback:
      - provider_name: nous
        model_string: poolside/laguna-s-2.1:free
      - provider_name: poolside
        model_string: poolside/laguna-s-2.1
      - provider_name: openrouter
        model_string: google/gemma-4-31b-it:free
      - provider_name: kilo
        model_string: kilo-auto/free

  # ─── Fast & cheap ("haiku" tier) ────────────────────────────────────
  haiku:
    provider_name: nous
    model_string: meituan/longcat-2.5-preview:free
    fallback:
      - provider_name: nous
        model_string: poolside/laguna-s-2.1:free
      - provider_name: poolside
        model_string: poolside/laguna-s-2.1
      - provider_name: openrouter
        model_string: google/gemma-4-26b-a4b-it:free
      - provider_name: kilo
        model_string: kilo-auto/free

  # `default` is the always-present catch-all for any unmatched model.
  default:
    provider_name: nous
    model_string: meituan/longcat-2.5-preview:free
    fallback:
      - provider_name: nous
        model_string: poolside/laguna-s-2.1:free
      - provider_name: poolside
        model_string: poolside/laguna-s-2.1
      - provider_name: kilo
        model_string: kilo-auto/free
